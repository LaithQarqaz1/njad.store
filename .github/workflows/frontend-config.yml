name: Frontend config

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FRONTEND_CONFIG_STRICT: "1"
      # ---- store identity ------------------------------------------------
      # Everything that differs between the stores built from this template.
      # Unset variables fall back to the committed store.identity.json — but the
      # resolver refuses to MIX the two for a given scope, so a half-configured
      # repo fails the build instead of shipping the previous store's brand.
      # Full list + meaning: STORE_SETUP.md
      FRONTEND_STORE_IDENTITY: ${{ vars.FRONTEND_STORE_IDENTITY }}
      FRONTEND_STORE_NAME: ${{ vars.FRONTEND_STORE_NAME || vars.STORE_NAME }}
      FRONTEND_STORE_NAME_AR: ${{ vars.FRONTEND_STORE_NAME_AR || vars.STORE_NAME_AR }}
      FRONTEND_STORE_SHORT_NAME: ${{ vars.FRONTEND_STORE_SHORT_NAME || vars.STORE_SHORT_NAME }}
      FRONTEND_THEME_COLOR: ${{ vars.FRONTEND_THEME_COLOR || vars.THEME_COLOR }}
      FRONTEND_SEO_TITLE: ${{ vars.FRONTEND_SEO_TITLE || vars.SEO_TITLE }}
      FRONTEND_SEO_DESCRIPTION: ${{ vars.FRONTEND_SEO_DESCRIPTION || vars.SEO_DESCRIPTION }}
      FRONTEND_SEO_SHORT_DESCRIPTION: ${{ vars.FRONTEND_SEO_SHORT_DESCRIPTION || vars.SEO_SHORT_DESCRIPTION }}
      FRONTEND_SEO_KEYWORDS: ${{ vars.FRONTEND_SEO_KEYWORDS || vars.SEO_KEYWORDS }}
      FRONTEND_WORKES_URL: ${{ vars.FRONTEND_WORKES_URL || secrets.FRONTEND_WORKES_URL || vars.WORKES_URL || secrets.WORKES_URL || vars.WORKERS_URL || secrets.WORKERS_URL }}
      FRONTEND_FIREBASE_SET: ${{ secrets.FRONTEND_FIREBASE_SET || vars.FRONTEND_FIREBASE_SET || secrets.FIREBASE_SET || vars.FIREBASE_SET || secrets.FIREBASE_CONFIG || vars.FIREBASE_CONFIG }}
      FRONTEND_SITE_ORIGIN: ${{ vars.FRONTEND_SITE_ORIGIN || secrets.FRONTEND_SITE_ORIGIN || vars.SITE_ORIGIN || secrets.SITE_ORIGIN }}
      FRONTEND_ADMIN_ORIGIN: ${{ vars.FRONTEND_ADMIN_ORIGIN || vars.ADMIN_ORIGIN }}
      FRONTEND_ZONE_NAME: ${{ vars.FRONTEND_ZONE_NAME || vars.CF_ZONE_NAME }}
      # Domain-bound and NOT derivable. If you override FRONTEND_SITE_ORIGIN here
      # you must supply these two as well: the previous store's Turnstile key
      # fails silently on a new domain, and an empty R2 public URL leaves every
      # image without an address. The build stops and names them if they are missing.
      FRONTEND_TURNSTILE_SITEKEY: ${{ vars.FRONTEND_TURNSTILE_SITEKEY || vars.TURNSTILE_SITEKEY }}
      FRONTEND_R2_PUBLIC_URL: ${{ vars.FRONTEND_R2_PUBLIC_URL || vars.R2_PUBLIC_URL || vars.FRONTEND_IMAGES_ORIGIN || vars.IMAGES_ORIGIN }}
      # Backend-only (Cloudflare resources). The frontend build never uses them,
      # so they are their own scope and their absence cannot stop a site deploy.
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      FRONTEND_NOTIFY_FROM_EMAIL: ${{ vars.FRONTEND_NOTIFY_FROM_EMAIL || vars.NOTIFY_FROM_EMAIL }}
      FRONTEND_NOTIFY_FROM_NAME: ${{ vars.FRONTEND_NOTIFY_FROM_NAME || vars.NOTIFY_FROM_NAME }}
      FRONTEND_ROUTER_HOST_ALIASES: ${{ vars.FRONTEND_ROUTER_HOST_ALIASES || vars.ROUTER_HOST_ALIASES }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID || secrets.CF_D1_DATABASE_ID }}
      SMS_GATEWAY_DIRECTORY_URL: ${{ vars.SMS_GATEWAY_DIRECTORY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No brand-specific literal may live outside store.identity.json and the
      # files generated from it — this is what stops the previous store's name,
      # domain or keys from following the template into the next repo.
      #
      # SKIPPED IN A PUBLISHED STORE REPO. Both this gate and the drift check
      # below read store.identity.json, and that file is deliberately never
      # published (it is the store's Firebase project, keys, R2 bucket and
      # Cloudflare/D1 ids — an infrastructure inventory that does not belong in a
      # public repo). They are TEMPLATE-side gates: the store manager runs both
      # locally, against the real file, before a publish is even offered, so
      # re-running them here could only ever add a way for the two to disagree.
      # `hashFiles` returns an empty string when nothing matches.
      - name: No hardcoded brand outside the store identity
        if: hashFiles('store.identity.json') != ''
        run: node scripts/check-brand-leaks.mjs

      # The committed files must already match the committed identity. Runs with
      # --source=file so a repository VARIABLE can never make the repo look
      # drifted; the variables are applied in the next step instead.
      - name: Verify committed files match store.identity.json
        if: hashFiles('store.identity.json') != ''
        run: node scripts/apply-store-identity.mjs --check --source=file

      # Drift gate: the committed artifacts (site-bundle.js, chunk-*.js,
      # site-bundle.css, index.html ?v=) must byte-match a rebuild from
      # src-frontend/. esbuild is pinned to the same version as the vendored
      # local binary (.tools/esbuild) — its output is deterministic per version.
      # MUST run BEFORE the identity is applied: the repository variables may
      # rewrite index.html, and this gate compares it byte-for-byte.
      - name: Verify built frontend matches sources
        run: |
          npm install --no-save esbuild@0.27.2
          node scripts/build-frontend.mjs --check

      # Now apply the deploy-time identity (repository variables win over the
      # committed store.identity.json) into site_settings.js, index.html,
      # manifest.webmanifest, robots.txt, sitemap.xml and web.config.
      - name: Apply store identity
        run: node scripts/apply-store-identity.mjs

      - name: Build static frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend-dist
          mkdir -p frontend-dist
          # Only hand-written ROOT files ship from the top level; every generated
          # asset lives in src-frontend/dist and is copied as a whole directory
          # below. These specific files cannot move: sw.js because a service
          # worker only controls its own directory and below, robots/sitemap
          # because crawlers read them from the root, 404.html because that is
          # where GitHub Pages looks, CNAME because Pages reads the custom
          # domain from the published root (omit it and the site falls back to
          # <owner>.github.io), and web.config/_redirects/_config.yml because
          # they are server configuration for the site root.
          public_files=(
            "index.html"
            "404.html"
            "reset-password.html"
            "manifest.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "sw.js"
            "web.config"
            "_config.yml"
            "_redirects"
            "CNAME"
          )
          for file in "${public_files[@]}"; do
            if [ -f "$file" ]; then
              cp "$file" "frontend-dist/$file"
            fi
          done

          # PUBLISH ONLY THE BUILD OUTPUT of src-frontend, never the sources.
          # src-frontend/ also holds ~5 MB of readable, unminified source; copying
          # the directory wholesale would publish the entire storefront source to
          # the web. Only src-frontend/dist goes out.
          if [ -d "src-frontend/dist" ]; then
            mkdir -p "frontend-dist/src-frontend"
            cp -R "src-frontend/dist" "frontend-dist/src-frontend/dist"
          fi

          for dir in "__" "vendor"; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "frontend-dist/$dir"
            fi
          done
          touch frontend-dist/.nojekyll

          # Fail loudly if a source file reached the published tree.
          if find frontend-dist/src-frontend -maxdepth 1 -type f | grep -q .; then
            echo "::error::src-frontend sources leaked into the published artifact"
            find frontend-dist/src-frontend -maxdepth 1 -type f
            exit 1
          fi

      # Guard what is actually about to go PUBLIC, not the whole repo. This repo
      # ships placeholder markers instead of any real store's values (see
      # store.identity.schema.json), so a marker surviving into the artifact
      # means a repository variable was never set — and the site would go live
      # with it in the <title>. Fail here, naming the missing values.
      #
      # Scanning frontend-dist rather than the repo is deliberate: backend-only
      # values (the Worker's D1, R2 and SMS settings) are not used by this deploy
      # and must not be able to block it. The desktop manager checks those when
      # it prepares a store folder.
      - name: No template placeholders left in the published site
        run: node scripts/check-placeholders.mjs --dir=frontend-dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-dist

  deploy-pages:
    if: ${{ vars.ENABLE_GITHUB_PAGES_DEPLOY == '1' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
